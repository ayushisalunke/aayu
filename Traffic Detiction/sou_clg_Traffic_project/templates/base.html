<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI | Driver Assistance System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f5f9ff, #eaf4ff);
    color: #333;
    overflow-x: hidden;
}

:root {
    --primary-blue: #007bff;
    --soft-blue: #eaf4ff;
    --glass-bg: rgba(255,255,255,0.85);
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb {
    background: var(--primary-blue);
    border-radius: 10px;
}

/* Sidebar */
.sidebar {
    height: 100vh;
    width: 240px;
    position: fixed;
    background: #ffffff;
    border-right: 1px solid #e0e0e0;
    padding-top: 40px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.05);
}

.sidebar h4 {
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    font-weight: 700;
    margin-bottom: 40px;
    letter-spacing: 2px;
    color: var(--primary-blue);
}

.sidebar a {
    display: block;
    padding: 14px 25px;
    margin: 8px 15px;
    border-radius: 12px;
    text-decoration: none;
    color: #333;
    transition: 0.3s ease;
}

.sidebar a:hover {
    background: var(--soft-blue);
    color: var(--primary-blue);
    transform: translateX(6px);
}

.sidebar a.logout-link {
    color: #dc3545;
}

.sidebar a.logout-link:hover {
    background: #ffe6e6;
}

/* Main Content */
.main-content {
    margin-left: 240px;
    padding: 35px;
}

/* Text colors */
.main-content h1,
.main-content h2,
.main-content h3,
.main-content h4,
.main-content h5,
.main-content h6 {
    color: #333 !important;
}

.main-content p,
.main-content span,
.main-content div {
    color: #555;
}

/* Topbar */
.topbar {
    background: #ffffff;
    padding: 20px 30px;
    border-radius: 20px;
    margin-bottom: 35px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

.topbar h4 {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    color: var(--primary-blue);
}

#clock {
    font-family: 'Orbitron', sans-serif;
    color: var(--primary-blue);
    font-size: 18px;
    text-align: right;
}

#date {
    font-size: 13px;
    opacity: 0.7;
    color: #777;
}

/* Cards */
.card-custom {
    background: #ffffff;
    border-radius: 25px;
    border: 1px solid #e0e0e0;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    transition: all 0.4s ease;
    color: #333;
}

.card-custom:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

/* Buttons */
.btn-primary {
    background: linear-gradient(45deg, #007bff, #0056b3);
    border: none;
    border-radius: 30px;
    padding: 10px 30px;
    font-weight: 600;
}

/* Fade animation */
.fade-in {
    animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Title effect */
.neon-text {
    color: var(--primary-blue);
}

/* Logout Modal */
.logout-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: 0.3s ease;
    z-index: 9999;
}

.logout-modal.active {
    opacity: 1;
    visibility: visible;
}

.logout-box {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    width: 350px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    transform: scale(0.8);
    transition: 0.3s ease;
}

.logout-modal.active .logout-box {
    transform: scale(1);
}

</style>
</head>

<body>

<div class="sidebar">
    <h4><i class="fas fa-car"></i> TRAFFIC AI</h4>

    <a href="/"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
    <a href="/analytics"><i class="fas fa-chart-line me-2"></i>Analytics</a>
    <a href="/history"><i class="fas fa-road me-2"></i>Drive Log</a>
    <a href="/about"><i class="fas fa-info-circle me-2"></i>About</a>
    <a href="#" onclick="showLogoutModal()" class="logout-link">
        <i class="fas fa-sign-out-alt me-2"></i>Logout
    </a>
</div>

<div class="main-content">

    <div class="topbar fade-in d-flex justify-content-between align-items-center">
        <h4 class="neon-text">
            <i class="fas fa-brain me-2"></i>
            AI Driver Assistance System
        </h4>

        <div class="text-end">
            <div id="clock"></div>
            <div id="date"></div>
        </div>
    </div>

    <div class="fade-in">
        {% block content %}{% endblock %}
    </div>
</div>

<!-- Logout Modal -->
<div id="logoutModal" class="logout-modal">
    <div class="logout-box">
        <h5 class="mb-3">Confirm Logout</h5>
        <p>Are you sure you want to logout?</p>
        <div class="mt-4 d-flex justify-content-center gap-3">
            <button class="btn btn-secondary" onclick="hideLogoutModal()">Cancel</button>
            <a href="/logout" class="btn btn-danger">Yes, Logout</a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
    AOS.init();

    function updateClock(){
        const now = new Date();
        document.getElementById("clock").innerText = now.toLocaleTimeString();
        document.getElementById("date").innerText = now.toDateString();
    }

    setInterval(updateClock, 1000);
    updateClock();

    function showLogoutModal(){
        document.getElementById("logoutModal").classList.add("active");
    }

    function hideLogoutModal(){
        document.getElementById("logoutModal").classList.remove("active");
    }
</script>

</body>
</html>
